[project]
name = "mado"
version = "v1"
description = "Weiss card library"
authors = [
    {name = "Akenaide", email = "kevin.mansang@gmail.com"},
]
dependencies = [
    "fastapi>=0.104.1",
    "strawberry-graphql[fastapi]>=0.227.2",
    "uvicorn[standard]>=0.24.0.post1",
    "pydantic-settings>=2.2.1",
    "meilisearch>=0.31.0",
    "httpx>=0.28.1",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "ptpython>=3.0.32",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/bin"]
testpaths = ["tests"]
